apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi
  namespace: minishop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      containers:
        - name: webapi
          image: minishop-webapi:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Kubernetes"
            - name: DOTNET_ENVIRONMENT
              value: "Kubernetes"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Swagger__Enabled
              value: "true"
            - name: Features__UseRedis
              value: "true"
            - name: Features__UseKafka
              value: "true"
            - name: Features__RunOutboxPublisher
              value: "true"
            - name: Features__RunPaymentCompletedConsumer
              value: "true"
            - name: Features__ApplyMigrationsOnStartup
              value: "true"
            - name: Features__CreateDatabaseOnStartup
              value: "true"

            - name: ConnectionStrings__MiniShopDb
              value: "Server=sqlserver,1433;Database=MiniShop;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False"
            - name: ConnectionStrings__Redis
              value: "redis:6379"

            - name: Kafka__BootstrapServers
              value: "kafka:9092"
            - name: Kafka__OrderPlacedTopic
              value: "minishop.order-placed.v1"
            - name: Kafka__OrderPaidTopic
              value: "minishop.order-paid.v1"
            - name: Kafka__PaymentCompletedTopic
              value: "minishop.payment-completed.v1"
            - name: Kafka__PaymentCompletedDeadLetterTopic
              value: "minishop.payment-completed.dlq.v1"
            - name: Kafka__PaymentCompletedConsumerGroup
              value: "minishop-orders"
            - name: Kafka__PaymentCompletedMaxProcessingRetries
              value: "3"

          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 60
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webapi
  namespace: minishop
spec:
  selector:
    app: webapi
  ports:
    - port: 8080
      targetPort: 8080