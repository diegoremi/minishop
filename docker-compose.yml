services:
  webapi:
    build:
      context: .
      dockerfile: MiniShop.WebApi/Dockerfile
    container_name: minishop-webapi
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker

      ConnectionStrings__MiniShop: "Server=sqlserver,1433;Database=MiniShop;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"

      Kafka__BootstrapServers: "kafka:9092"
      Kafka__OrderPlacedTopic: "minishop.order-placed.v1"
      Kafka__OrderPaidTopic: "minishop.order-paid.v1"
      Kafka__PaymentCompletedTopic: "minishop.payment-completed.v1"
      Kafka__PaymentCompletedDeadLetterTopic: "minishop.payment-completed.dlq.v1"
      Kafka__PaymentCompletedConsumerGroup: "minishop-orders"
      Kafka__PaymentCompletedMaxProcessingRetries: 3

    depends_on:
      - sqlserver
      - redis
      - kafka

  payment-worker:
    build:
      context: .
      dockerfile: MiniShop.PaymentWorker/Dockerfile
    container_name: minishop-payment-worker
    environment:
      DOTNET_ENVIRONMENT: Docker

      Kafka__BootstrapServers: "kafka:9092"
      Kafka__OrderPlacedTopic: "minishop.order-placed.v1"
      Kafka__PaymentCompletedTopic: "minishop.payment-completed.v1"
      Kafka__ConsumerGroup: "minishop-payment-worker"

    depends_on:
      - kafka

  redis:
    image: redis:7
    container_name: minishop-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.1
    container_name: minishop-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: minishop-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: MiniShop Local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: minishop-sqlserver
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - minishop-sqlserver-data:/var/opt/mssql

volumes:
  minishop-sqlserver-data: